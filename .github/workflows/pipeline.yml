name: CI/CD - Billing Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ghcr.io/castor-garage/mecanica-billing-soat
  EKS_CLUSTER: castor-garage
  AWS_REGION: us-east-1

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
          POSTGRES_DB: mecanica_billing_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d mecanica_billing_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # reportsDirectory proprio (coverage/integration, ver
      # vitest.integration.config.ts) - vitest nao faz merge de cobertura
      # entre processos `vitest run` separados, entao cada rodada grava o
      # seu lcov.info e o SonarCloud le os dois (ver sonar-project.properties).
      - name: Run integration tests with coverage
        run: npm run test:coverage -- --config vitest.integration.config.ts
        env:
          TEST_DATABASE_URL: postgresql://workshop:workshop@localhost:5432/mecanica_billing_test_db
          # Opcional: so quando presente o smoke test real do Mercado Pago roda;
          # sem o secret ele e pulado (ver README).
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}

      # Requer o secret SONAR_TOKEN (SonarCloud) configurado no repositorio -
      # ver README para o passo a passo de configuracao.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy em produção (main)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace
        run: kubectl apply -f k8s/api/overlays/production/namespace.yaml

      # billing-secret e (re)criado a cada deploy, sem nada aplicado a mao no
      # cluster: banco vem do SSM publicado por mecanica-db-infra-SOAT, filas
      # do SSM publicado por mecanica-k8s-infra-SOAT, e as chaves de terceiros
      # (New Relic, Mercado Pago, Stripe, MongoDB) dos secrets do GitHub - as
      # que faltarem vao vazias. Le cada parametro do SSM numa variavel antes
      # de montar o Secret para o step falhar (set -e) se algum nao existir.
      - name: Montar Secret do servico a partir do SSM (production)
        run: |
          ssm() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text; }
          DATABASE_URL=$(ssm /castor-garage/billing/database-url)
          echo "::add-mask::${DATABASE_URL}"
          BILLING_COMMANDS_URL=$(ssm /castor-garage/queues/billing-commands-url)
          OS_EVENTS_URL=$(ssm /castor-garage/queues/os-events-url)
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-production create secret generic billing-secret \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=SQS_BILLING_COMMANDS_QUEUE_URL="${BILLING_COMMANDS_URL}" \
            --from-literal=SQS_OS_EVENTS_QUEUE_URL="${OS_EVENTS_URL}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${NEW_RELIC_LICENSE_KEY}" \
            --from-literal=MERCADOPAGO_ACCESS_TOKEN="${MERCADOPAGO_ACCESS_TOKEN}" \
            --from-literal=MERCADOPAGO_WEBHOOK_SECRET="${MERCADOPAGO_WEBHOOK_SECRET}" \
            --from-literal=STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            --from-literal=NOSQL_CONNECTION_STRING="${NOSQL_CONNECTION_STRING}" \
            --dry-run=client -o yaml | kubectl --context "${EKS_CLUSTER}" apply -f -
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NOSQL_CONNECTION_STRING: ${{ secrets.NOSQL_CONNECTION_STRING }}

      - name: Patch da tag de imagem (production)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/production/kustomization.yaml

      - name: Aplicar configuração via kustomize (production)
        run: kubectl apply -k k8s/api/overlays/production

      - name: Aguardar rollout (production)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-production rollout status deployment/billing-api --timeout=180s

      # O Service do Billing e LoadBalancer so por causa do webhook do Mercado
      # Pago (POST /webhooks/mercadopago), que precisa de uma URL publica - o
      # resto da integracao com o OS Service e por SQS.
      - name: Descobrir hostname do LoadBalancer (production)
        id: lb
        run: |
          for i in $(seq 1 20); do
            HOST=$(kubectl --context "${EKS_CLUSTER}" -n castor-garage-production get svc billing-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "aguardando o Load Balancer provisionar... ($i/20)"
            sleep 15
          done
          echo "Load Balancer nao ficou pronto a tempo" >&2
          exit 1

      - name: Smoke test (/health) - production
        run: |
          HOST="${{ steps.lb.outputs.hostname }}"
          for i in $(seq 1 15); do
            if curl -sf "http://${HOST}:3000/health"; then exit 0; fi
            echo "aguardando o Billing responder... ($i/15)"
            sleep 10
          done
          echo "Billing nao respondeu a tempo" >&2
          exit 1

      - name: Publicar URL do webhook no SSM Parameter Store (production)
        run: |
          WEBHOOK_URL="http://${{ steps.lb.outputs.hostname }}:3000/webhooks/mercadopago"
          aws ssm put-parameter \
            --name /castor-garage/production/billing-webhook-url \
            --type String \
            --overwrite \
            --value "${WEBHOOK_URL}"
          echo "Webhook do Mercado Pago (cadastrar no painel): ${WEBHOOK_URL}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy em staging (develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace (staging)
        run: kubectl apply -f k8s/api/overlays/staging/namespace.yaml

      # Mesmo esquema do deploy de producao, com o database de staging. Sem
      # URLs de fila: so existe um conjunto de filas SQS (de producao) e
      # staging consumindo dele roubaria mensagens da saga de producao - as
      # variaveis SQS_* sao opcionais no Deployment e ficam vazias aqui.
      - name: Montar Secret do servico a partir do SSM (staging)
        run: |
          ssm() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text; }
          DATABASE_URL=$(ssm /castor-garage/billing/database-url-staging)
          echo "::add-mask::${DATABASE_URL}"
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging create secret generic billing-secret \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${NEW_RELIC_LICENSE_KEY}" \
            --from-literal=MERCADOPAGO_ACCESS_TOKEN="${MERCADOPAGO_ACCESS_TOKEN}" \
            --from-literal=MERCADOPAGO_WEBHOOK_SECRET="${MERCADOPAGO_WEBHOOK_SECRET}" \
            --from-literal=STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            --from-literal=NOSQL_CONNECTION_STRING="${NOSQL_CONNECTION_STRING}" \
            --dry-run=client -o yaml | kubectl --context "${EKS_CLUSTER}" apply -f -
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NOSQL_CONNECTION_STRING: ${{ secrets.NOSQL_CONNECTION_STRING }}

      - name: Patch da tag de imagem (staging)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/staging/kustomization.yaml

      - name: Aplicar configuração via kustomize (staging)
        run: kubectl apply -k k8s/api/overlays/staging

      - name: Aguardar rollout (staging)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging rollout status deployment/billing-api --timeout=180s

      - name: Descobrir hostname do LoadBalancer (staging)
        id: lb
        run: |
          for i in $(seq 1 20); do
            HOST=$(kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging get svc billing-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "aguardando o Load Balancer provisionar... ($i/20)"
            sleep 15
          done
          echo "Load Balancer nao ficou pronto a tempo" >&2
          exit 1

      - name: Smoke test (/health) - staging
        run: |
          HOST="${{ steps.lb.outputs.hostname }}"
          for i in $(seq 1 15); do
            if curl -sf "http://${HOST}:3000/health"; then exit 0; fi
            echo "aguardando o Billing responder... ($i/15)"
            sleep 10
          done
          echo "Billing nao respondeu a tempo" >&2
          exit 1

      - name: Publicar URL do webhook no SSM Parameter Store (staging)
        run: |
          WEBHOOK_URL="http://${{ steps.lb.outputs.hostname }}:3000/webhooks/mercadopago"
          aws ssm put-parameter \
            --name /castor-garage/staging/billing-webhook-url \
            --type String \
            --overwrite \
            --value "${WEBHOOK_URL}"
          echo "Webhook do Mercado Pago (cadastrar no painel): ${WEBHOOK_URL}" >> "$GITHUB_STEP_SUMMARY"
