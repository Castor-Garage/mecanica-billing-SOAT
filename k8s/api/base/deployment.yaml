apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  labels:
    app: billing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: api
          image: ghcr.io/castor-garage/mecanica-billing-soat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: DATABASE_URL
            - name: NEW_RELIC_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: NEW_RELIC_APP_NAME
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_AI_MONITORING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: NEW_RELIC_AI_MONITORING_ENABLED
            - name: NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED
            - name: NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED
            # Credenciais AWS (SQS/DynamoDB) vem da LabRole dos nodes via IMDS -
            # nao ha access key aqui, so a regiao.
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: AWS_REGION
            - name: DYNAMODB_PAYMENT_ATTEMPTS_TABLE
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: DYNAMODB_PAYMENT_ATTEMPTS_TABLE
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: MERCADOPAGO_ACCESS_TOKEN
            # Opcionais: so existem em producao (staging nao tem filas proprias
            # - ver pipeline).
            - name: SQS_BILLING_COMMANDS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: SQS_BILLING_COMMANDS_QUEUE_URL
                  optional: true
            - name: SQS_OS_EVENTS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: SQS_OS_EVENTS_QUEUE_URL
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
