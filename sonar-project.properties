sonar.projectKey=Castor-Garage_mecanica-billing-SOAT
sonar.organization=castor-garage
sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
sonar.exclusions=**/*.test.ts
# Sem isso, o "Zero Coverage Sensor" do Sonar conta qualquer arquivo de
# sonar.sources ausente dos lcov.info acima como 0% coberto - mesmo os que a
# gente deliberadamente nao mede no vitest.config.ts (wiring puro, adapters
# finos para sistemas externos sem logica propria testavel no nivel
# unitario). Isso inflava artificialmente o "uncovered" e reprovava
# "Coverage on New Code" mesmo com os arquivos certos bem cobertos.
sonar.coverage.exclusions=src/main.ts,src/infrastructure/http/server.ts,src/infrastructure/http/routes/debug.routes.ts,src/infrastructure/database/**,src/infrastructure/providers/**,src/infrastructure/messaging/SqsMessageBus.ts,src/infrastructure/messaging/bus.ts,src/infrastructure/messaging/bootstrapConsumers.ts,src/domain/**/I*.ts
